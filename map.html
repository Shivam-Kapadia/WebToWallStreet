<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071739">
<title>Field Map — WebToWallStreet</title>
<meta name="description" content="The WebToWallStreet field map. Every day of the consulting curriculum as a territory to explore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/w2ws.css">
</head>
<body>

<div class="map-bg" aria-hidden="true"></div>

<div class="topbar">
  <div class="topbar-in">
    <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true">
      <polygon class="e-plate" points="11,1 29,1 39,11 39,29 29,39 11,39 1,29 1,11"/>
      <polygon class="e-edge" points="11,1 29,1 39,11 39,29 29,39 11,39 1,29 1,11"/>
      <g class="e-web">
        <line x1="20" y1="20" x2="20" y2="4"/><line x1="20" y1="20" x2="31" y2="9"/>
        <line x1="20" y1="20" x2="36" y2="20"/><line x1="20" y1="20" x2="31" y2="31"/>
        <line x1="20" y1="20" x2="20" y2="36"/><line x1="20" y1="20" x2="9" y2="31"/>
        <line x1="20" y1="20" x2="4" y2="20"/><line x1="20" y1="20" x2="9" y2="9"/>
        <polygon points="20,10 27,13 30,20 27,27 20,30 13,27 10,20 13,13"/>
      </g>
      <g class="e-bug">
        <rect x="18" y="18" width="4" height="5"/><rect x="18" y="15" width="4" height="2"/>
        <rect x="17" y="13" width="2" height="1"/><rect x="21" y="13" width="2" height="1"/>
        <rect x="13" y="15" width="4" height="1"/><rect x="11" y="13" width="2" height="2"/>
        <rect x="23" y="15" width="4" height="1"/><rect x="27" y="13" width="2" height="2"/>
        <rect x="13" y="19" width="4" height="1"/><rect x="11" y="20" width="2" height="2"/>
        <rect x="23" y="19" width="4" height="1"/><rect x="27" y="20" width="2" height="2"/>
        <rect x="15" y="23" width="3" height="1"/><rect x="13" y="24" width="2" height="2"/>
        <rect x="22" y="23" width="3" height="1"/><rect x="25" y="24" width="2" height="2"/>
      </g>
    </svg>
    <span class="tb-name">WEBTOWALLSTREET</span>
    <span class="tb-badge">FIELD MAP</span>
    <span class="tb-tick" id="tick">EXPLORED: <b>0%</b></span>
    <span class="tb-spacer"></span>
    <a class="tb-link" href="index.html">&lt; HOME</a>
  </div>
</div>

<div class="mapwrap">

  <main class="stage px">

    <div class="stage-top">
      <span class="stage-title">SIGHTING FIELD</span>
      <div class="legend">
        <span class="lg new"><i></i>Unexplored</span>
        <span class="lg part"><i></i>In progress</span>
        <span class="lg done"><i></i>Cleared</span>
      </div>
    </div>

    <div class="counter" id="counter">&mdash;</div>

    <!-- the map itself, rendered by assets/js/map.js -->
    <div class="field" id="field" tabindex="0" aria-label="Field map. Drag to pan."></div>

    <div class="field-orn orn-radar" aria-hidden="true">
      <svg class="radar" viewBox="0 0 120 120">
        <g class="strand">
          <line x1="60" y1="60" x2="60" y2="4"/><line x1="60" y1="60" x2="100" y2="20"/>
          <line x1="60" y1="60" x2="116" y2="60"/><line x1="60" y1="60" x2="100" y2="100"/>
          <line x1="60" y1="60" x2="60" y2="116"/><line x1="60" y1="60" x2="20" y2="100"/>
          <line x1="60" y1="60" x2="4" y2="60"/><line x1="60" y1="60" x2="20" y2="20"/>
        </g>
        <g class="ring">
          <polygon points="60,42 73,47 78,60 73,73 60,78 47,73 42,60 47,47"/>
          <polygon points="60,26 84,36 94,60 84,84 60,94 36,84 26,60 36,36"/>
          <polygon points="60,10 95,25 110,60 95,95 60,110 25,95 10,60 25,25"/>
        </g>
        <g class="sweep"><polygon points="60,60 116,60 106,30"/><line x1="60" y1="60" x2="116" y2="60"/></g>
        <g id="radarBlips"></g>
      </svg>
    </div>

    <div class="field-orn orn-agent agent" aria-hidden="true">
      <svg viewBox="0 0 20 24">
        <g class="a-body">
          <rect x="6" y="10" width="8" height="7"/><rect x="4" y="11" width="2" height="5"/>
          <rect x="14" y="11" width="2" height="5"/><rect x="6" y="17" width="3" height="6"/>
          <rect x="11" y="17" width="3" height="6"/><rect x="3" y="16" width="2" height="3"/>
          <rect x="15" y="16" width="2" height="3"/>
        </g>
        <g class="a-head"><rect x="6" y="3" width="8" height="7"/><rect x="7" y="2" width="6" height="1"/></g>
        <g class="a-visor"><rect x="6" y="5" width="3" height="3"/><rect x="11" y="5" width="3" height="3"/></g>
        <g class="a-strap"><rect x="9" y="5" width="2" height="1"/><rect x="5" y="6" width="1" height="2"/><rect x="14" y="6" width="1" height="2"/></g>
      </svg>
      <span class="a-tag">FIELD UNIT</span>
    </div>

    <nav class="regionbar" id="regionbar" aria-label="Regions"></nav>

  </main>

  <div class="maptools">
    <button class="btn sm" type="button" id="resumeBtn">RESUME WHERE I LEFT OFF</button>
    <button class="btn sm ghost" type="button" id="resetBtn">RESET PROGRESS</button>
    <span class="note" id="persistNote">Click a territory to open its dossier &middot; drag to pan</span>
  </div>

  <div class="ticker" aria-hidden="true">
    <div class="ticker-in" id="tickerIn"></div>
  </div>

</div>

<!-- ============ dossier panel ============ -->
<div class="scrim" id="scrim"></div>

<aside class="dossier" id="dossier" role="dialog" aria-modal="true"
       aria-labelledby="dosTitle" aria-hidden="true">
  <div class="dos-head">
    <p class="dos-eyebrow" id="dosEyebrow">REGION</p>
    <h2 class="dos-title" id="dosTitle">&mdash;</h2>
    <button class="dos-close" type="button" id="dosClose" aria-label="Close dossier">&#10005;</button>
  </div>
  <div class="dos-body" id="dosBody"></div>
  <div class="dos-foot" id="dosFoot"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/curriculum.js"></script>
<script src="assets/js/progress.js"></script>
<script src="assets/js/map.js"></script>
</body>
</html>
